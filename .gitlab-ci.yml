# SPDX-License-Identifier: AGPL-3.0-or-later

stages:
  - lint
  - build
  - manifest

variables:
  IMAGE: ${CI_REGISTRY_IMAGE}

vet:
  stage: lint
  image: golang:1.25-alpine
  script:
    - go vet ./...
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build-amd64:
  extends: .docker-build
  tags:
    - saas-linux-small-amd64
  script:
    - docker build --tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64" --push .

build-arm64:
  extends: .docker-build
  tags:
    - saas-linux-small-arm64
  script:
    - docker build --tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}-arm64" --push .

.manifest:
  stage: manifest
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  needs:
    - build-amd64
    - build-arm64

manifest-branch:
  extends: .manifest
  script:
    - docker manifest create "${IMAGE}:latest"
        "${IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64"
        "${IMAGE}:${CI_COMMIT_SHORT_SHA}-arm64"
    - docker manifest push "${IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

manifest-tag:
  extends: .manifest
  script:
    - docker manifest create "${IMAGE}:${CI_COMMIT_TAG}"
        "${IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64"
        "${IMAGE}:${CI_COMMIT_SHORT_SHA}-arm64"
    - docker manifest push "${IMAGE}:${CI_COMMIT_TAG}"
    - docker manifest create "${IMAGE}:latest"
        "${IMAGE}:${CI_COMMIT_SHORT_SHA}-amd64"
        "${IMAGE}:${CI_COMMIT_SHORT_SHA}-arm64"
    - docker manifest push "${IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_TAG
