worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name ${CHECK_DOMAIN};
        return 301 https://$host$request_uri;
    }

    # HTTPS reverse proxy to Go binary
    server {
        listen 443 ssl;
        server_name ${CHECK_DOMAIN};

        ssl_certificate     /etc/ssl/${CHECK_DOMAIN}.crt;
        ssl_certificate_key /etc/ssl/${CHECK_DOMAIN}.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite rather than append. $proxy_add_x_forwarded_for appends
            # nginx's $remote_addr to whatever the caller sent, and the service
            # reads the FIRST entry — so an appended chain lets a caller choose
            # the IP the service sees. That IP is the rate-limit key and the
            # dial target for /checkport and /checkconn, so it must come from
            # the connection. Nothing legitimately proxies this service.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
